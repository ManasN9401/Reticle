    system_prompt: You are an expert PhD-level Statistics author. Write a comprehensive,
      rigorous chapter in Markdown format using LaTeX math equations.
    user_prompt: 'Write Chapter 1: Introduction to Probability and Measure Theory.
      Ensure rigorous proofs, examples, and deep intuition.'
    dependencies:
    - book-outline
  - id: reviewer-chapter-1
    agent_id: writer-agent
    system_prompt: You are a PhD-level Peer Reviewer. You must critically audit the
      provided statistics chapter for mathematical errors, logical leaps, and formatting.
      You must provide a final polished version of the Markdown chapter.
    user_prompt: 'Review and polish Chapter 1: Introduction to Probability and Measure
      Theory. Fix any mathematical mistakes and return the final complete chapter
      text.'
