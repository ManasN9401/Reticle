<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperParallel Telemetry</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --error-color: #f85149;
            --warning-color: #d29922;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 2rem;
            color: #ffffff;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }

        .node-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .node-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--text-secondary);
            transition: background-color 0.3s ease;
        }

        .node-card.status-running::before {
            background-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
        }

        .node-card.status-completed::before {
            background-color: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }
        
        .node-card.status-failed::before {
            background-color: var(--error-color);
            box-shadow: 0 0 10px var(--error-color);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .node-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin: 0;
        }

        .node-task {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: monospace;
            word-break: break-all;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .chip {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(88, 166, 255, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chip.artifact {
            background: rgba(35, 134, 54, 0.15);
            color: #3fb950;
            border-color: rgba(35, 134, 54, 0.3);
        }

        .status-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        .status-running .status-badge { color: var(--accent-color); }
        .status-completed .status-badge { color: var(--success-color); }
        .status-failed .status-badge { color: var(--error-color); }

        .log-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 2rem;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .log-entry {
            margin-bottom: 0.3rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.3rem;
        }

        .log-time { color: var(--text-secondary); margin-right: 10px; }
        .log-type { color: var(--accent-color); font-weight: bold; margin-right: 10px; }
        .log-source { color: var(--warning-color); margin-right: 10px; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    </style>
</head>
<body>

    <h1>HyperParallel Orchestrator</h1>
    
    <div class="container">
        <div class="nodes-grid" id="nodesContainer">
            <!-- Nodes will be injected here -->
        </div>

        <div class="log-panel" id="logContainer">
            <!-- Logs will be injected here -->
        </div>
    </div>

    <script>
        const nodesContainer = document.getElementById('nodesContainer');
        const logContainer = document.getElementById('logContainer');
        const nodes = new Map();

        // Connect to WebSocket
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

        ws.onopen = () => appendLog('SYSTEM', 'frontend', 'Connected to Telemetry Server');
        ws.onclose = () => appendLog('SYSTEM', 'frontend', 'Disconnected from Telemetry Server');
        ws.onerror = (e) => appendLog('ERROR', 'frontend', 'WebSocket error occurred');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            processEvent(data);
        };

        function processEvent(e) {
            appendLog(e.Type, e.Source, JSON.stringify(e.Payload));

            const type = e.Type;
            const payload = e.Payload;

            // Determine Task/Worker ID based on event type
            let workerId = payload.worker_id || payload.producer || payload.agent_id;
            let taskId = payload.task_id || payload.id; // artifact uses id but it's not task_id

            if (!workerId && type !== 'TaskCreated') return;

            // Handle Node Lifecycle
            if (type === 'WorkerStarted' || type === 'TaskDispatched') {
                createOrUpdateNode(workerId, taskId, 'running');
                
                // If it has an LLM model injected
                if (payload.llm_model) {
                    addChip(workerId, `🧠 ${payload.llm_model}`);
                }
            }
            else if (type === 'WorkerCompleted') {
                createOrUpdateNode(workerId, taskId, 'completed');
            }
            else if (type === 'WorkerFailed') {
                createOrUpdateNode(workerId, taskId, 'failed');
            }
            else if (type === 'ArtifactsProduced') {
                workerId = payload.producer;
                if (workerId) {
                    addChip(workerId, `📄 Artifact Created`, 'artifact');
                }
            }
        }

        function createOrUpdateNode(workerId, taskId, status) {
            let nodeEl = document.getElementById(`node-${workerId}`);
            
            if (!nodeEl) {
                nodeEl = document.createElement('div');
                nodeEl.id = `node-${workerId}`;
                nodeEl.className = 'node-card';
                
                nodeEl.innerHTML = `
                    <div class="node-header">
                        <h3 class="node-title">${workerId}</h3>
                        <span class="status-badge" id="badge-${workerId}">INITIALIZING</span>
                    </div>
                    <div class="node-task" id="task-${workerId}">${taskId || ''}</div>
                    <div class="chips" id="chips-${workerId}"></div>
                `;
                
                nodesContainer.appendChild(nodeEl);
                nodes.set(workerId, nodeEl);
            }

            // Update status
            nodeEl.className = `node-card status-${status}`;
            document.getElementById(`badge-${workerId}`).innerText = status.toUpperCase();
            if (taskId && !document.getElementById(`task-${workerId}`).innerText) {
                document.getElementById(`task-${workerId}`).innerText = taskId;
            }
        }

        function addChip(workerId, text, typeClass = '') {
            const chipsContainer = document.getElementById(`chips-${workerId}`);
            if (!chipsContainer) return;

            // Avoid duplicate chips for the same model
            if (Array.from(chipsContainer.children).some(c => c.innerText === text)) {
                return;
            }

            const chip = document.createElement('span');
            chip.className = `chip ${typeClass}`;
            chip.innerText = text;
            chipsContainer.appendChild(chip);
        }

        function appendLog(type, source, content) {
            const el = document.createElement('div');
            el.className = 'log-entry';
            
            const time = new Date().toLocaleTimeString();
            el.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-type">${type}</span>
                <span class="log-source">(${source})</span>
                <span class="log-content">${content}</span>
            `;
            
            logContainer.appendChild(el);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
    </script>
</body>
</html>
