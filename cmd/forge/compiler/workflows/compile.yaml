id: forge-compiler
name: Reticle Forge Compiler
version: 1.0.0
nodes:
  - id: arch-1
    agent: architect-agent
    parameters:
      effort: absolute
  - id: scaff-1
    agent: scaffolder-agent
    parameters:
      effort: standard
  - id: code-1
    agent: coder-agent
    parameters:
      effort: elevated
  - id: write-1
    agent: writer-agent
    parameters:
      effort: low
edges:
  - from: arch-1
    to: scaff-1
  - from: arch-1
    to: code-1
  - from: scaff-1
    to: write-1
  - from: code-1
    to: write-1
