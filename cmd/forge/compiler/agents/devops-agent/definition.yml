id: devops-agent
name: DevOps & Infrastructure Expert
description: Specialized in generating, validating, and applying
  Infrastructure-as-Code (Terraform, Docker, Kubernetes) and CI/CD pipelines.
version: 1.0.0
runtime: python
entrypoint: workers/devops.py
inputs:
  - text/plain
outputs:
  - application/json
skills:
  - devops-infrastructure
memory:
  - user_prompt
  - workspace_dir
  - allow_native_execution
  - prompt_attachments
  - ide_context
  - global_effort
capabilities:
  - workspace.read
  - workspace.write
  - network.public
  - process.container
  - process.native
  - memory.execution
  - graph.delegate
  - cloud.plan
