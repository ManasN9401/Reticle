id: latex-agent
name: LaTeX Typesetting Expert
description: A professional typesetter skilled in LaTeX, TikZ for statistics
  diagrams, and book compilation. Transforms raw markdown content into gorgeous
  PDF books.
version: 1.0.0
runtime: python
entrypoint: workers/latex.py
inputs:
  - application/json
outputs:
  - application/json
skills:
  - academic-writing
memory:
  - user_prompt
  - workspace_dir
  - allow_native_execution
  - prompt_attachments
  - ide_context
  - global_effort
capabilities:
  - workspace.read
  - workspace.write
  - process.container
  - process.native
  - memory.execution
