id: quant-agent
name: Quantitative Finance Analyst
description: "Analyses listed securities with Yahoo Finance data through yfinance: quotes, price history, financial statements, technical indicators and risk metrics, computed in code and saved as CSV. Analysis, not investment advice."
version: 2.0.0
runtime: python
entrypoint: workers/quant.py
inputs:
  - text/plain
outputs:
  - application/json
skills:
  - quant-finance
memory:
  - user_prompt
  - workspace_dir
  - allow_native_execution
  - prompt_attachments
  - ide_context
  - global_effort
capabilities:
  - workspace.read
  - workspace.write
  - network.public
  - process.container
