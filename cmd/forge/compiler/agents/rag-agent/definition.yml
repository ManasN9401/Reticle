id: "rag-agent"
name: "Knowledge Retrieval Agent"
description: "Indexes codebases into a local ChromaDB vector space and retrieves/summarizes dense context for other agents."
worker:
  command: "python"
  args: ["{AGENT_DIR}/workers/rag.py"]
capabilities:
  - "vector-search"
  - "indexing"
  - "summarization"
required_skills:
  - "rag-knowledge-base"
