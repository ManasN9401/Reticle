id: hermes-coder-agent
name: Hermes Coder Expert
description: "A coder that works in a read-eval-print loop: it writes tests first, writes code, runs it in the terminal, reads the failure, fixes one thing and runs again, and finishes only when the code has run clean after its last change."
version: 2.0.0
runtime: python
entrypoint: workers/hermes.py
inputs:
  - text/plain
outputs:
  - application/json
skills:
  - hermes-repl
memory:
  - user_prompt
  - workspace_dir
  - allow_native_execution
  - prompt_attachments
  - ide_context
  - global_effort
capabilities:
  - workspace.read
  - workspace.write
  - network.public
  - process.container
  - process.native
