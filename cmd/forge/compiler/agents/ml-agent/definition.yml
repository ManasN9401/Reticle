id: ml-agent
name: Machine Learning Engineer
description: Specialized in designing, writing, and debugging Deep Learning
  models exclusively using PyTorch and HuggingFace.
version: 1.0.0
runtime: python
entrypoint: workers/ml_engineer.py
inputs:
  - text/plain
outputs:
  - document/markdown
skills:
  - ml-engineering
memory:
  - user_prompt
  - workspace_dir
  - allow_native_execution
  - prompt_attachments
  - ide_context
  - global_effort
capabilities:
  - workspace.read
  - workspace.write
  - network.public
  - process.container
  - process.native
  - memory.execution
  - graph.delegate
  - gpu.use
