id: browser-agent
name: Browser Automation Expert
description: "Reads and extracts information from public websites with a real headless browser (Playwright): navigates multi-step pages, clicks, fills search forms and returns what the pages show. Read-only by default, stops at access walls, and saves every page it read under browse/."
version: 2.0.0
runtime: python
entrypoint: workers/browser.py
inputs:
  - text/plain
outputs:
  - application/json
skills:
  - browser-automation
memory:
  - user_prompt
  - workspace_dir
  - allow_native_execution
  - prompt_attachments
  - ide_context
  - global_effort
capabilities:
  - workspace.read
  - workspace.write
  - network.public
  - browser.run
