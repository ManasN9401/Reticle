id: "browser-agent"
name: "Browser Automation Expert"
description: "A highly-skilled agent capable of navigating complex websites and extracting information using Playwright automation."
version: "1.0.0"
capabilities:
  - "browser_automation"
  - "dom_extraction"
inputs:
  - id: "dag_json"
    type: "application/json"
    description: "The DAG JSON containing all agent definitions"
outputs:
  - id: "python_worker_files"
    type: "application/json"
    description: "The generated Python worker script for this agent"
