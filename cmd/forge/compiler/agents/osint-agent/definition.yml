id: osint-agent
name: OSINT Research Analyst
description: "Open-source research: live web searches (Google through Serper, or Brave or a SearXNG server, whichever is configured), parallel page fetching, cross-checking, and a cited report backed by a source ledger. Passive, public sources only."
version: 2.0.0
runtime: python
entrypoint: workers/osint.py
inputs:
  - text/plain
outputs:
  - application/json
skills:
  - osint-investigation
memory:
  - user_prompt
  - workspace_dir
  - allow_native_execution
  - prompt_attachments
  - ide_context
  - global_effort
capabilities:
  - workspace.read
  - workspace.write
  - network.public
